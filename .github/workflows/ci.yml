name: Test and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - name: Windows PowerShell 5.1 parity
        if: runner.os == 'Windows'
        shell: powershell
        env:
          OFFICE_TEST_POWERSHELL: powershell
        run: python -m pytest tests -q -k powershell
      - run: python tools/package_skill.py --out dist/ai-office-builder.skill
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_skill.py --out dist/ai-office-builder.skill
      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ai-office-builder.skill --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
